name: DallyReport checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Node >=21 is required for `node --test` glob expansion (the test
          # script passes a quoted glob) and for the global WebSocket that
          # src/linuxdo.mjs uses. 22 = current LTS line, matches production.
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run lint and tests
        run: npm run check
